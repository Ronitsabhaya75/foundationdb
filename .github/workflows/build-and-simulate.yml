name: Build and Simulate

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'research/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test_file:
        description: 'Simulation test TOML to run'
        required: false
        default: 'tests/fast/MaxGrvQueueDelay.toml'
      build_target:
        description: 'Ninja target to build (e.g. fdbserver, fdbserver_core_test)'
        required: false
        default: 'fdbserver'
      build_type:
        description: 'CMake build type (Release, RelWithDebInfo, Debug)'
        required: false
        default: 'Release'

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Free Disk Space on Runner
        run: |
          echo "Disk space before cleanup:"
          df -h
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo docker image prune --all --force || true
          echo "Disk space after cleanup:"
          df -h

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: fdb-ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            fdb-ccache-${{ runner.os }}-${{ github.ref_name }}-
            fdb-ccache-${{ runner.os }}-

      - name: Compile fdbserver from source and run simulation
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'Release' }}
          TEST_FILE: ${{ inputs.test_file || 'tests/fast/MaxGrvQueueDelay.toml' }}
        run: |
          set -euo pipefail

          test -f "$TEST_FILE"
          mkdir -p build .ccache

          echo "Compiling fdbserver from commit $GITHUB_SHA"
          echo "Build type: $BUILD_TYPE"
          echo "Simulation: $TEST_FILE"

          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/.ccache:/root/.ccache" \
            -e BUILD_TYPE="$BUILD_TYPE" \
            -e TEST_FILE="$TEST_FILE" \
            -e CCACHE_DIR=/root/.ccache \
            -e CCACHE_MAXSIZE=5G \
            -e GOFLAGS=-buildvcs=false \
            -w /workspace/build \
            docker.io/foundationdb/build:rockylinux9-latest \
            bash -euo pipefail -c '
              source /opt/rh/gcc-toolset-13/enable || true
              git config --global --add safe.directory /workspace

              cmake -G Ninja \
                -D CMAKE_BUILD_TYPE="$BUILD_TYPE" \
                -D BUILD_SWIFT_BINDING=OFF \
                -D BUILD_TESTING=OFF \
                -D ENABLE_UNIT_TESTS=OFF \
                -D USE_CCACHE=ON \
                -D USE_LD=LLD \
                -D USE_LIBCXX=1 \
                -D USE_WERROR=OFF \
              ..

              # Build fdbserver entirely from the checked-out source.
              ninja fdbserver

              test -x bin/fdbserver

              echo "Compiled binary:"
              bin/fdbserver --version
              ccache --show-stats || true

              echo "Running simulation: $TEST_FILE"
              bin/fdbserver \
                -r simulation \
                -f "../$TEST_FILE" \
                --seed 12345 \
                --buggify off
            '

      - name: Upload Test Traces and Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fdb-simulation-traces
          path: |
            build/trace.*.xml
            build/trace.*.json
          if-no-files-found: ignore
